<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>NixClaw</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="boot" class="boot">Loading…</div>

<main id="login" class="login" hidden>
  <div class="login-card">
    <h1>NixClaw</h1>
    <form id="login-number">
      <label for="login-number-input">Signal number</label>
      <input id="login-number-input" name="number" type="tel" autocomplete="tel" placeholder="+49…" required>
      <p class="hint">A confirmation code will be sent to this number via Signal.</p>
      <button type="submit" class="primary">Send code</button>
    </form>
    <form id="login-code" hidden>
      <p class="hint" id="login-code-hint"></p>
      <label for="login-code-input">Code</label>
      <input id="login-code-input" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required>
      <label for="login-endpoint-input">Name of this device</label>
      <input id="login-endpoint-input" name="endpoint" maxlength="64" required>
      <button type="submit" class="primary">Log in</button>
      <button type="button" id="login-back" class="link">Use a different number</button>
    </form>
    <p id="login-error" class="error" hidden></p>
  </div>
</main>

<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="roster-toggle" class="icon" title="Channels" aria-label="Channels">☰</button>
    <div id="topbar-title" class="topbar-title"></div>
    <nav class="views">
      <button data-view="chat" class="icon" title="Chat" aria-label="Chat">💬</button>
      <button data-view="files" class="icon" title="Files" aria-label="Files">📁</button>
      <button data-view="settings" class="icon" title="Settings" aria-label="Settings">⚙</button>
    </nav>
  </header>
  <div class="body">
    <aside id="roster" class="roster"></aside>
    <div id="roster-backdrop" class="backdrop"></div>
    <section id="view-chat" class="view chat"></section>
    <section id="view-files" class="view files" hidden></section>
    <section id="view-settings" class="view settings" hidden></section>
  </div>
</div>
</body>
</html>
