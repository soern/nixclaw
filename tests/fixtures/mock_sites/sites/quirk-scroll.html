<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Kleinanzeigen Nord - Classifieds</title>
<style>body{font-family:sans-serif;max-width:700px;margin:2em auto}
.item{border-bottom:1px solid #ddd;padding:30px 0}
#loading{color:#888;padding:20px;text-align:center}</style>
</head>
<body>
<h1>Kleinanzeigen Nord</h1>
<p>Endless feed of classified ads. New listings load as you scroll. The listing
you might be looking for is somewhere further down (page 5 of the feed).</p>
<div id="feed"></div>
<div id="loading">Scroll down to load more&hellip;</div>
<script>
let pageNo = 0, done = false, busy = false;
async function loadMore(){
  if (done || busy) return;
  busy = true;
  pageNo += 1;
  const r = await fetch('/api/scroll?page=' + pageNo);
  const data = await r.json();
  done = data.done;
  const feed = document.getElementById('feed');
  for (const it of data.items){
    const d = document.createElement('div');
    d.className = 'item';
    d.textContent = it.text;
    feed.appendChild(d);
  }
  if (done) document.getElementById('loading').textContent = 'End of feed.';
  busy = false;
  // Real infinite scrollers keep loading until the page overflows the viewport.
  if (!done && document.body.offsetHeight <= window.innerHeight) loadMore();
}
loadMore();
window.addEventListener('scroll', ()=>{
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) loadMore();
});
</script>
</body>
</html>
