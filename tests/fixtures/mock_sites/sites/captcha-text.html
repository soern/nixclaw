<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Checkpoint - Human Verification</title>
<style>
body{font-family:sans-serif;background:#22262b;color:#eee;display:flex;flex-direction:column;align-items:center;padding-top:60px}
.card{background:#2d333b;border:1px solid #444;border-radius:8px;padding:28px;text-align:center}
canvas{background:#fff;border-radius:4px}
input{margin-top:14px;padding:8px;font-size:16px;width:160px;text-align:center;text-transform:uppercase}
button{margin-top:12px;padding:9px 26px;font-size:15px;background:#347d39;color:#fff;border:none;border-radius:4px;cursor:pointer}
#result{margin-top:12px;min-height:1.2em}
#secret{display:none;margin-top:14px;padding:12px;background:#1c3320;border:1px solid #347d39;border-radius:4px;text-align:left}
</style>
</head>
<body>
<div class="card">
<h1>Checkpoint &mdash; human verification</h1>
<p>Type the characters you see in the image below to continue.</p>
<canvas id="cap" width="260" height="90" role="img" aria-label="verification image"></canvas>
<br>
<input id="answer" aria-label="verification characters" autocomplete="off" placeholder="characters">
<br>
<button id="submit">Submit</button>
<div id="result" role="status"></div>
<div id="secret">
  <h2>Verified</h2>
  <p>Your support ticket number is <strong>TEXT-SOLVED-2846</strong>.</p>
  <p>An agent will reach out within 24 hours regarding your warranty claim.</p>
</div>
</div>
<script>
// Code drawn on canvas only - never present in the DOM text.
const CODE = 'X7K4P9';
const ctx = document.getElementById('cap').getContext('2d');
ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,260,90);
for (let i=0;i<7;i++){ // noise lines
  ctx.strokeStyle = 'rgba(60,60,60,0.45)';
  ctx.beginPath();
  ctx.moveTo(Math.sin(i*3.1)*130+130, (i*37)%90);
  ctx.lineTo(Math.cos(i*1.7)*130+130, (i*53+20)%90);
  ctx.stroke();
}
ctx.font = 'bold 38px monospace';
ctx.fillStyle = '#1b3a6b';
for (let i=0;i<CODE.length;i++){
  ctx.save();
  ctx.translate(28+i*38, 58);
  ctx.rotate(((i*47)%30-15)*Math.PI/180);
  ctx.fillText(CODE[i], 0, 0);
  ctx.restore();
}
document.getElementById('submit').addEventListener('click', ()=>{
  const val = document.getElementById('answer').value.trim().toUpperCase();
  const result = document.getElementById('result');
  if (val === CODE) {
    result.textContent = 'Correct.';
    result.style.color = '#57ab5a';
    document.getElementById('secret').style.display = 'block';
  } else {
    result.textContent = 'Wrong characters, try again.';
    result.style.color = '#e5534b';
  }
});
document.getElementById('answer').addEventListener('keydown', e=>{
  if (e.key === 'Enter') document.getElementById('submit').click();
});
</script>
</body>
</html>
